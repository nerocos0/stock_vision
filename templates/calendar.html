{% extends 'base.html' %}
{% load static %}

{% block title %}Календарь - StockVision{% endblock %}

{% block nav_calendar %}active{% endblock %} <!-- Подсвечиваем иконку календаря -->

{% block content %}
<header class="page-header">
    <a href="/" class="logo">StockVision</a>
    <div id="auth-buttons"></div>
</header>

<div class="dashboard-container">
    <h2>Экономический календарь</h2>
    
    <div class="calendar-filters">
        <label><input type="checkbox" id="filter-high" checked> Высокая</label>
        <label><input type="checkbox" id="filter-medium"> Средняя</label>
        <label><input type="checkbox" id="filter-low"> Низкая</label>
    </div>

    <div class="table-container">
        <table class="calendar-table">
            <thead>
                <tr><th>Время</th><th>Валюта</th><th>Событие</th><th>Факт</th><th>Прогноз</th><th>Предыдущее</th></tr>
            </thead>
            <tbody id="calendar-body"></tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/calendar.js' %}"></script>
{% endblock %}
