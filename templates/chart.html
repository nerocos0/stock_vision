{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StockVision Chart</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>

    <header>
        <a href="/" class="logo">StockVision</a>
        
        <div class="controls">
            <button id="fav-btn" class="auth-btn fav" style="display: none;">
                В избранное
            </button>

            <select id="symbol-select">
                <option value="EURUSD">Загрузка...</option>
            </select>

            <select id="timezone-select" class="auth-btn" style="padding: 6px; font-size: 14px; cursor: pointer;">
                <option value="0">UTC</option>
                <option value="3">МСК (UTC+3)</option>
                <option value="-5">Нью-Йорк (UTC-5)</option>
            </select>
            
            <div class="timeframes">
                <button class="tf-btn" data-tf="5min">5m</button>
                <button class="tf-btn active" data-tf="1h">1h</button>
                <button class="tf-btn" data-tf="4h">4h</button>
                <button class="tf-btn" data-tf="1day">1D</button>
                <button class="tf-btn" data-tf="1week">1W</button>
                <button class="tf-btn" data-tf="1month">1M</button>
            </div>

            <div class="indicator-dropdown">
                <button id="indicator-btn" class="auth-btn">Индикаторы ▾</button>
                <div id="indicator-menu" class="dropdown-menu">
                    <div class="indicator-item">
                        <label>
                            <input type="checkbox" id="chk-rsi" value="rsi"> RSI
                        </label>
                        <input type="number" id="period-rsi" class="period-input" value="14" min="2" max="200">
                    </div>
                    <div class="indicator-item">
                        <label>
                            <input type="checkbox" id="chk-ema" value="ema"> EMA
                        </label>
                        <input type="number" id="period-ema" class="period-input" value="20" min="2" max="200">
                    </div>
                    <div class="indicator-item">
                        <label>
                            <input type="checkbox" id="chk-sma" value="sma"> SMA
                        </label>
                        <input type="number" id="period-sma" class="period-input" value="50" min="2" max="200">
                    </div>
                </div>
            </div>
        </div>

        <div id="auth-buttons"></div>
    </header>

    <div class="chart-layout">
        <div id="chart-container"></div>

        <div class="resizer" id="dragMe"></div>

        <aside class="sidebar" id="watchlist-sidebar">
            <h3 class="sidebar-title">Избранное</h3>
            <div id="watchlist-items">
            </div>
        </aside>
    </div>

    <script type="module" src="{% static 'js/chart.js' %}"></script>
</body>
</html>
