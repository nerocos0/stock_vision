{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StockVision - Авторизация</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <a href="/" class="logo" style="text-decoration: none;">StockVision</a>
    </header>

    <div class="login-container">
        <div class="login-box">
            
            <div class="auth-tabs">
                <button id="tab-login" class="auth-tab active">Вход</button>
                <button id="tab-register" class="auth-tab">Регистрация</button>
            </div>
            
            <form id="form-login">
                <div class="form-group">
                    <label for="login-username">Имя пользователя</label>
                    <input type="text" id="login-username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-submit">Войти</button>
                <div style="text-align: right; margin-top: 10px;">
                    <a href="#" id="btn-forgot-password" style="color: #2962FF; text-decoration: none; font-size: 14px;">Забыли пароль?</a>
                </div>
                <div id="error-login" class="error-msg"></div>
            </form>

            <form id="form-register" style="display: none;">
                <div class="form-group">
                    <label for="reg-username">Имя пользователя</label>
                    <input type="text" id="reg-username" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Пароль</label>
                    <input type="password" id="reg-password" required>
                </div>
                <div class="form-group">
                    <label for="reg-password2">Подтвердите пароль</label>
                    <input type="password" id="reg-password2" required>
                </div>
                <button type="submit" class="btn-submit">Зарегистрироваться</button>
                <div id="error-register" class="error-msg"></div>
            </form>
            
        </div>
    </div>
    
    <div id="forgot-password-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Восстановление пароля</h3>
            <p style="color: #787b86; font-size: 14px; margin-bottom: 20px;">
                Введите email, указанный при регистрации. Мы отправим ссылку для сброса пароля.
            </p>
            <form id="forgot-password-form">
                <div class="form-group">
                    <label for="reset-email">Email</label>
                    <input type="email" id="reset-email" required>
                </div>
                <button type="submit" class="btn-submit">Отправить</button>
                <button type="button" id="btn-close-modal" class="auth-btn" style="width: 100%; margin-top: 10px;">Отмена</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="{% static 'js/auth_page.js' %}"></script>
</body>
</html>
