{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StockVision - Сброс пароля</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <a href="/" class="logo">StockVision</a>
    </header>

    <div class="login-container">
        <div class="login-box">
            <h2>Сброс пароля</h2>
            
            <form id="reset-password-form">
                <div class="form-group">
                    <label for="new_password">Новый пароль</label>
                    <input type="password" id="new_password" required>
                </div>
                <div class="form-group">
                    <label for="new_password2">Подтвердите пароль</label>
                    <input type="password" id="new_password2" required>
                </div>
                <button type="submit" class="btn-submit">Сменить пароль</button>
                <div id="error-message" class="error-msg"></div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="{% static 'js/reset_password.js' %}"></script>
</body>
</html>
