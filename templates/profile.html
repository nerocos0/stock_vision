{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StockVision - Профиль</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <a href="/" class="logo">StockVision</a>
        <div id="auth-buttons"></div>
    </header>

    <div class="dashboard-container"> <!-- Используем стили дашборда для отступов -->
        <div class="profile-card">
            <h2>Мой профиль</h2>
            <p class="profile-info">Имя пользователя: <strong id="profile-username">...</strong></p>
            <p class="profile-info">Email: <strong id="profile-email">...</strong></p>
            
            <div class="profile-actions">
                <button id="btn-show-password" class="btn-submit" style="width: auto; padding: 10px 20px;">Сменить пароль</button>
                <!-- Кнопку смены email добавим позже, когда сделаем бэкенд -->
                <button id="btn-show-email" class="auth-btn" style="padding: 10px 20px;">Сменить email (скоро)</button>
            </div>
        </div>

        <!-- Скрытая форма смены пароля -->
        <div id="password-form-container" class="login-box" style="display: none; margin: 20px auto;">
            <h3 style="color: white; text-align: center;">Смена пароля</h3>
            <form id="change-password-form">
                <div class="form-group">
                    <label for="old_password">Текущий пароль</label>
                    <input type="password" id="old_password" required>
                </div>
                <div class="form-group">
                    <label for="new_password">Новый пароль</label>
                    <input type="password" id="new_password" required>
                </div>
                <div class="form-group">
                    <label for="new_password2">Подтвердите новый пароль</label>
                    <input type="password" id="new_password2" required>
                </div>
                <button type="submit" class="btn-submit">Сменить пароль</button>
                <button type="button" id="btn-cancel-password" class="auth-btn" style="width: 100%; margin-top: 10px;">Отмена</button>
                <div id="error-message" class="error-msg"></div>
            </form>
        </div>
    </div>

    <script type="module" src="{% static 'js/profile.js' %}"></script>
</body>
</html>
