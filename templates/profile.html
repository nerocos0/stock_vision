{% extends 'base.html' %}
{% load static %}

{% block title %}Профиль - StockVision{% endblock %}

{% block nav_profile %}active{% endblock %}

{% block content %}
<header class="page-header">
    <a href="/" class="logo">StockVision</a>
    <div id="auth-buttons"></div>
</header>

<div class="dashboard-container">
    <div class="profile-card">
        <h2>Мой профиль</h2>
        <p class="profile-info">Имя пользователя: <strong id="profile-username">...</strong></p>
        <p class="profile-info">Email: <strong id="profile-email">...</strong></p>
        
        <div class="profile-actions">
            <button id="btn-show-password" class="btn-submit">Сменить пароль</button>
            <button id="btn-show-email" class="auth-btn">Сменить email</button>
        </div>
    </div>

    <div id="password-form-container" class="profile-card" style="display: none;">
        <h3 style="color: white; text-align: center;">Смена пароля</h3>
        <form id="change-password-form">
            <div class="form-group">
                <label for="old_password">Текущий пароль</label>
                <input type="password" id="old_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">Новый пароль</label>
                <input type="password" id="new_password" required>
            </div>
            <div class="form-group">
                <label for="new_password2">Подтвердите новый пароль</label>
                <input type="password" id="new_password2" required>
            </div>
            <button type="submit" class="btn-submit">Сменить пароль</button>
            <button type="button" id="btn-cancel-password" class="auth-btn" style="width: 100%; margin-top: 10px;">Отмена</button>
            <div id="error-message" class="error-msg"></div>
        </form>
    </div>  
    
    <div id="email-form-container" class="profile-card" style="display: none;">
        <h3 style="color: white; text-align: center;">Смена email</h3>
        <form id="change-email-form">
            <div class="form-group">
                <label for="new_email">Новый email</label>
                <input type="email" id="new_email" required>
            </div>
            <div class="form-group">
                <label for="email_password">Текущий пароль (для подтверждения)</label>
                <input type="password" id="email_password" required>
            </div>
            <button type="submit" class="btn-submit">Сменить email</button>
            <button type="button" id="btn-cancel-email" class="auth-btn" style="width: 100%; margin-top: 10px;">Отмена</button>
            <div id="email-error-message" class="error-msg"></div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module" src="{% static 'js/profile.js' %}"></script>
{% endblock %}
